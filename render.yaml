services:
  - type: web
    name: matlens-web
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: GEMINI_MODEL
        value: auto
      - key: GEMINI_API_KEY
        sync: false
      - key: MP_API_KEY
        sync: false
      - key: MATLENS_STORAGE_DIR
        value: /app/backend/storage
    # [선택 사항] 유료 플랜($7/월~)에서 영구 디스크를 연결하여 업로드 파일 및 DB를 영구 보존하려면 아래 주석을 해제하세요.
    # disk:
    #   name: matlens-data
    #   mountPath: /var/data
    #   sizeGB: 1
